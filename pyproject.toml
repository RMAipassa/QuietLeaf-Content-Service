[project]
name = "quietleaf-service"
version = "0.6.0"
description = "Self-hosted content API for QuietLeaf, with private local archives and pluggable sources"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "playwright>=1.48,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["quietleaf_service"]

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"
